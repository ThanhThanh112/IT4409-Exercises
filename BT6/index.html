<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý người dùng</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #222; }
.container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #4a7bd0; border-radius: 6px; }
h1 { margin-top: 0; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.toolbar input { padding: 6px 10px; width: 280px; border: 1px solid #aaa; border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
th { background: #eef2fa; }
tr:hover td { background: #f8faff; }
button { padding: 5px 12px; margin-right: 4px; border: 1px solid #888; border-radius: 4px; background: #fff; cursor: pointer; }
button:hover { background: #eef2fa; }
.btn-primary { background: #2f6fdb; color: #fff; border-color: #2f6fdb; }
.btn-primary:hover { background: #2559b3; }
.btn-delete { color: #c0392b; border-color: #c0392b; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 999; }
.modal-content { background: #fff; padding: 16px; border-radius: 6px; width: 340px; max-height: 90vh; overflow-y: auto; }
.modal-content h4 { margin: 0 0 10px; }
.form-row { display: flex; flex-direction: column; margin-bottom: 8px; }
.form-row label { font-size: 13px; margin-bottom: 3px; }
.form-row input { padding: 6px; border: 1px solid #aaa; border-radius: 4px; }
.modal-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
.empty { text-align: center; color: #888; padding: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const emptyUser = {
  name: "", username: "", email: "",
  address: { street: "", suite: "", city: "" },
  phone: "", website: ""
};

const fields = [
  { id: "name", label: "Name" },
  { id: "username", label: "Username" },
  { id: "email", label: "Email" },
  { id: "street", label: "Street" },
  { id: "suite", label: "Suite" },
  { id: "city", label: "City" },
  { id: "phone", label: "Phone" },
  { id: "website", label: "Website" }
];

const addressFields = ["street", "suite", "city"];

function getValue(data, id) {
  return addressFields.includes(id) ? data.address[id] : data[id];
}

function setValue(data, id, value) {
  if (addressFields.includes(id)) {
    return { ...data, address: { ...data.address, [id]: value } };
  }
  return { ...data, [id]: value };
}

function SearchForm({ onChangeValue }) {
  return (
    <input
      type="text"
      placeholder="Tìm theo name, username"
      onChange={(e) => onChangeValue(e.target.value)}
    />
  );
}

function AddUser({ onAdd }) {
  const [adding, setAdding] = React.useState(false);
  const [user, setUser] = React.useState(emptyUser);

  const handleChange = (e) => {
    const { id, value } = e.target;
    setUser(setValue(user, id, value));
  };

  const closeForm = () => {
    setUser(emptyUser);
    setAdding(false);
  };

  const handleAdd = () => {
    if (user.name.trim() === "" || user.username.trim() === "") {
      alert("Vui lòng nhập Name và Username!");
      return;
    }
    onAdd(user);
    closeForm();
  };

  return (
    <div>
      <button className="btn-primary" onClick={() => setAdding(true)}>Thêm</button>
      {adding && (
        <div className="modal-overlay">
          <div className="modal-content">
            <h4>Thêm người dùng</h4>
            {fields.map((f) => (
              <div className="form-row" key={f.id}>
                <label htmlFor={f.id}>{f.label}:</label>
                <input
                  id={f.id}
                  type="text"
                  value={getValue(user, f.id)}
                  onChange={handleChange}
                />
              </div>
            ))}
            <div className="modal-actions">
              <button className="btn-primary" onClick={handleAdd}>Thêm</button>
              <button onClick={closeForm}>Hủy</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ResultTable({ keyword, user, onAdded }) {
  const [users, setUsers] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [editing, setEditing] = React.useState(null);

  React.useEffect(() => {
    fetch("https://jsonplaceholder.typicode.com/users")
      .then((res) => res.json())
      .then((data) => {
        setUsers(data);
        setLoading(false);
      })
      .catch(() => setLoading(false));
  }, []);

  React.useEffect(() => {
    if (user) {
      setUsers((prev) => {
        const nextId = prev.reduce((max, u) => Math.max(max, u.id), 0) + 1;
        return [...prev, { ...user, id: nextId }];
      });
      onAdded();
    }
  }, [user]);

  const filteredUsers = users.filter(
    (u) =>
      u.name.toLowerCase().includes(keyword.toLowerCase()) ||
      u.username.toLowerCase().includes(keyword.toLowerCase())
  );

  function editUser(u) {
    setEditing({ ...u, address: { ...u.address } });
  }

  function handleEditChange(id, value) {
    setEditing((prev) => setValue(prev, id, value));
  }

  function saveUser() {
    if (editing.name.trim() === "" || editing.username.trim() === "") {
      alert("Vui lòng nhập Name và Username!");
      return;
    }
    setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
    setEditing(null);
  }

  function removeUser(id) {
    setUsers((prev) => prev.filter((u) => u.id !== id));
  }

  if (loading) return <p>Đang tải dữ liệu...</p>;

  return (
    <div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>Username</th>
            <th>Email</th>
            <th>Địa chỉ</th>
            <th>Số điện thoại</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          {filteredUsers.map((u) => (
            <tr key={u.id}>
              <td>{u.id}</td>
              <td>{u.name}</td>
              <td>{u.username}</td>
              <td>{u.email}</td>
              <td>{u.address.street}, {u.address.suite}, {u.address.city}</td>
              <td>{u.phone}</td>
              <td>
                <button onClick={() => editUser(u)}>Sửa</button>
                <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {filteredUsers.length === 0 && <p className="empty">Không có người dùng phù hợp</p>}
      {editing && (
        <div className="modal-overlay">
          <div className="modal-content">
            <h4>Sửa người dùng</h4>
            {fields.map((f) => (
              <div className="form-row" key={f.id}>
                <label htmlFor={"edit-" + f.id}>{f.label}:</label>
                <input
                  id={"edit-" + f.id}
                  type="text"
                  value={getValue(editing, f.id)}
                  onChange={(e) => handleEditChange(f.id, e.target.value)}
                />
              </div>
            ))}
            <div className="modal-actions">
              <button className="btn-primary" onClick={saveUser}>Lưu</button>
              <button onClick={() => setEditing(null)}>Hủy</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [kw, setKeyword] = React.useState("");
  const [newUser, setNewUser] = React.useState(null);

  return (
    <div className="container">
      <h1>Quản lý người dùng</h1>
      <div className="toolbar">
        <SearchForm onChangeValue={setKeyword} />
        <AddUser onAdd={setNewUser} />
      </div>
      <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
